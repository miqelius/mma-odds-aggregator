<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MMA Intelligence Hub</title>
<style>
  body { 
    margin: 0; 
    font-family: sans-serif; 
    background: #050505; 
    color: #fff; 
    overflow-x: hidden; 
    position: relative; 
    min-height: 100vh;
  }
  
  /* GLOBAL BACKGROUND SLIDESHOW */
  .bg-slideshow { 
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%; 
    z-index: -2; 
    pointer-events: none; 
  }
  .bg-slideshow img { 
    position: absolute; 
    width: 100%; 
    height: 100%; 
    object-fit: cover; 
    transition: opacity 1.5s ease-in-out; 
    opacity: 0; 
  }
  .bg-slideshow img.active { 
    opacity: 1; 
  }
  
  /* DARK OVERLAY SO TEXT IS READABLE */
  .page-overlay {
    position: fixed; 
    top: 0; 
    left: 0; 
    width: 100%; 
    height: 100%;
    background: rgba(5, 5, 5, 0.85); 
    z-index: -1; 
    pointer-events: none;
  }

  /* TOP HEADER SECTION */
  .hero { 
    padding: 50px 20px 30px 20px; 
    text-align: center; 
  }
  .hero h1 { 
    font-size: 42px; 
    margin: 0; 
    color: #fff; 
    text-shadow: 0 2px 10px rgba(0,0,0,0.9); 
    letter-spacing: 2px; 
    text-transform: uppercase; 
  }
  .hero h1 span { 
    color: #ff3333; 
  }
  .coming-soon { 
    font-size: 14px; 
    color: #ff3333; 
    letter-spacing: 4px; 
    margin-top: 10px; 
    text-transform: uppercase; 
    font-weight: bold; 
  }

  /* GRID LAYOUT */
  .container { 
    max-width: 1100px; 
    margin: 20px auto; 
    padding: 0 20px; 
    display: grid; 
    grid-template-columns: 1fr 1fr; 
    gap: 20px; 
  }
  .card { 
    background: rgba(18, 10, 10, 0.85); 
    border: 1px solid #3d1a1a; 
    border-radius: 8px; 
    padding: 25px; 
    text-align: center; 
    transition: 0.3s; 
    backdrop-filter: blur(5px);
  }
  .card:hover { 
    border-color: #ff3333; 
  }
  .card h2 { 
    color: #ff3333; 
    font-size: 18px; 
    margin-top: 0; 
    margin-bottom: 10px; 
    letter-spacing: 1px; 
  }
  .status-text { 
    color: #777; 
    font-size: 13px; 
    text-transform: uppercase; 
    letter-spacing: 2px; 
  }

  /* BOT SECTION */
  .bot-section { 
    max-width: 1100px; 
    margin: 20px auto 40px auto; 
    padding: 0 20px; 
  }
  .bot-card { 
    background: rgba(18, 10, 10, 0.85); 
    border: 1px solid #ff3333; 
    border-radius: 8px; 
    padding: 20px; 
    text-align: center; 
    backdrop-filter: blur(5px);
  }
  .bot-card h2 { 
    margin: 0 0 10px 0; 
    color: #ff3333; 
    font-size: 16px; 
  }
  .bot-card input { 
    width: 70%; 
    padding: 10px; 
    background: #050505; 
    border: 1px solid #3d1a1a; 
    color: #fff; 
    border-radius: 4px; 
    outline: none; 
  }
  .bot-card input:focus { 
    border-color: #ff3333; 
  }
</style>
</head>
<body>

  <!-- GLOBAL BACKGROUND SLIDESHOW -->
  <div class="bg-slideshow">
    <img src="tony.png" class="active" alt="Tony Ferguson">
    <img src="khabib.jpg" alt="Khabib Nurmagomedov">
    <img src="jones.jpg" alt="Jon Jones">
    <img src="conor.jpg" alt="Conor McGregor">
  </div>
  <div class="page-overlay"></div>

  <!-- HERO SECTION WITH MMA NEWS -->
  <div class="hero">
    <h1>MMA <span>NEWS</span></h1>
    <div class="coming-soon">Coming Soon</div>
  </div>

  <!-- CONTENT GRID -->
  <div class="container">
    <div class="card">
      <h2>მომავალი UFC ბრძოლების კუშები</h2>
      <div class="status-text">Coming Soon</div>
    </div>
    <div class="card">
      <h2>ჩვენი ექსპერტების პიკები</h2>
      <div class="status-text">Coming Soon</div>
    </div>
  </div>

  <div class="container" style="margin-top: 0;">
    <div class="card">
      <h2>დასრულებული ბრძოლები</h2>
      <div class="status-text">Coming Soon</div>
    </div>
    <div class="card">
      <h2>ლეგენდარული ბრძოლები</h2>
      <div class="status-text">Coming Soon</div>
    </div>
  </div>

  <!-- MMA EXPERT BOT -->
  <div class="bot-section">
    <div class="bot-card">
      <h2>MMA ექსპერტი ბოტი</h2>
      <input type="text" placeholder="ჰკითხე რამე UFC-ზე...">
    </div>
  </div>

  <script>
    let slides = document.querySelectorAll('.bg-slideshow img');
    let current = 0;
    setInterval(() => {
      slides[current].classList.remove('active');
      current = (current + 1) % slides.length;
      slides[current].classList.add('active');
    }, 4000);
  </script>

</body>
</html>
